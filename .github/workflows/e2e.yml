name: E2E

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ github.event_name == 'schedule' && 'Full suite' || 'Smoke' }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Chromium smoke only; the nightly run covers every browser.
        browser: ${{ github.event_name == 'schedule' && fromJSON('["chromium","firefox","webkit"]') || fromJSON('["chromium"]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/huddlekit_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/platform
      - name: Run smoke tests
        if: github.event_name != 'schedule'
        run: pnpm test:e2e:smoke
        working-directory: apps/platform
      - name: Run full suite
        if: github.event_name == 'schedule'
        run: pnpm test:e2e --project=${{ matrix.browser }}
        working-directory: apps/platform
        env:
          E2E_ALL_BROWSERS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/platform/playwright-report
            apps/platform/test-results
          retention-days: 7
